<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Slow Code Buster</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b0f1a;
  --panel:#11162a;
  --accent:#4da3ff;
  --good:#4dff88;
  --bad:#ff5c5c;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'JetBrains Mono',monospace;
  background:radial-gradient(circle at top,var(--panel),var(--bg));
  color:#e6e9f0;
}
section{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
#game,#result{display:none}

h1{
  font-size:3.2rem;
  margin:0;
  background:linear-gradient(90deg,#4da3ff,#8affc1);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

button{
  cursor:pointer;
  transition:.3s ease;
}

/* ---------- BUTTONS ---------- */
button.start{
  padding:1.5rem 3.5rem;
  font-size:1.6rem;
  font-weight:bold;
  border:none;
  border-radius:16px;
  background:linear-gradient(135deg,#4da3ff,#6b7cff);
  color:#fff;
  box-shadow:0 12px 35px rgba(77,163,255,.5);
}
button.start:hover{
  transform:translateY(-3px);
  box-shadow:0 16px 50px rgba(77,163,255,.7);
}

.nav-buttons{
  width:90%;
  max-width:1100px;
  display:flex;
  justify-content:space-between;
  margin-top:1rem;
}
.nav-buttons .btn{
  padding:1.2rem 3rem;
  font-size:1.4rem;
  font-weight:bold;
  border:none;
  border-radius:16px;
  background:linear-gradient(135deg,#4da3ff,#6b7cff);
  color:#fff;
  box-shadow:0 12px 35px rgba(77,163,255,.5);
}
.nav-buttons .btn:hover{
  transform:translateY(-3px);
  box-shadow:0 16px 50px rgba(77,163,255,.7);
}

/* ---------- HUD ---------- */
.hud{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:1rem;
  width:90%;
  max-width:1100px;
  margin-bottom:1rem;
}
.hud div{
  background:rgba(255,255,255,.05);
  padding:1rem;
  border-radius:14px;
  text-align:center;
}
.hud span{font-size:1.8rem;font-weight:bold}

/* ---------- CODE BOX ---------- */
#codeBox{
  width:90%;
  max-width:1100px;
  background:#05070f;
  border-radius:16px;
  padding:2rem;
  font-size:1.4rem;
  line-height:1.8;
  min-height:300px;
}

.char{opacity:.35}
.char.correct{color:var(--good);opacity:1}
.char.wrong{color:var(--bad);opacity:1}
.char.active{
  background:rgba(77,163,255,.25);
  border-bottom:3px solid var(--accent);
  opacity:1;
}

/* ---------- INPUT ---------- */
#input{
  margin-top:1.2rem;
  width:90%;
  max-width:1100px;
  padding:1.2rem;
  font-size:1.3rem;
  border-radius:14px;
  border:2px solid rgba(255,255,255,.1);
  background:#0c1022;
  color:white;
}
#input:focus{outline:none;border-color:var(--accent)}
</style>
</head>

<body>

<!-- GATE -->
<section id="gate">
  <h1>Slow Code Buster</h1>
  <p>เริ่มจากง่าย → ไต่ระดับวิศวกรรม</p>
  <button class="start" onclick="start()">START</button>
</section>

<!-- GAME -->
<section id="game">
  <div class="hud">
    <div>LEVEL<span id="level">1</span></div>
    <div>TIME<span id="time">0</span></div>
    <div>CORRECT<span id="correct">0</span></div>
    <div>WRONG<span id="wrong">0</span></div>
    <div>SCORE<span id="score">0</span></div>
  </div>

  <div id="codeBox"></div>
  <input id="input" placeholder="พิมพ์ทีละตัวอักษร" autocomplete="off">

  <div class="nav-buttons">
    <button class="btn back" onclick="goBack()">⬅ Back</button>
    <button class="btn next" onclick="nextLevel()">Next ➡</button>
  </div>
</section>

<!-- RESULT -->
<section id="result">
  <h1 id="rank"></h1>
  <div class="nav-buttons">
    <button class="btn next" onclick="nextLevel()">NEXT ➡</button>
  </div>
</section>

<script>
/* ---------- DATA ---------- */
const levels=[
`let x = 10;
console.log(x);`,

`for(let i=0;i<3;i++){
  console.log(i);
}`,

`function add(a,b){
  return a + b;
}`,

`function factorial(n){
  if(n===1) return 1;
  return n * factorial(n-1);
}`,

`function binarySearch(arr,target){
  let left=0,right=arr.length-1;
  while(left<=right){
    let mid=Math.floor((left+right)/2);
    if(arr[mid]===target) return mid;
    if(arr[mid]<target) left=mid+1;
    else right=mid-1;
  }
  return -1;
}`
];

let levelIndex=0;
let charIndex=0;
let correct=0, wrong=0, score=0;
let finished=false;
let time=0;
let timer=null;

/* ---------- ELEMENTS ---------- */
const gate=document.getElementById("gate");
const game=document.getElementById("game");
const result=document.getElementById("result");
const box=document.getElementById("codeBox");
const input=document.getElementById("input");

const levelEl=document.getElementById("level");
const correctEl=document.getElementById("correct");
const wrongEl=document.getElementById("wrong");
const scoreEl=document.getElementById("score");
const rankEl=document.getElementById("rank");
const timeEl=document.getElementById("time");

/* ---------- FUNCTIONS ---------- */
function loadCode(){
  box.innerHTML="";
  charIndex=0;
  finished=false;
  correct=wrong=score=0;
  correctEl.textContent=0;
  wrongEl.textContent=0;
  scoreEl.textContent=0;

  [...levels[levelIndex]].forEach((c,i)=>{
    const span=document.createElement("span");
    span.textContent=c;
    span.className="char"+(i===0?" active":"");
    box.appendChild(span);
  });

  startTimer();
}

function startTimer(){
  clearInterval(timer);
  time=0;
  timeEl.textContent=0;
  timer=setInterval(()=>{
    time++;
    timeEl.textContent=time;
  },1000);
}

function stopTimer(){
  clearInterval(timer);
}

function start(){
  gate.style.display="none";
  game.style.display="flex";
  loadCode();
}

input.addEventListener("keydown",e=>{
  if(finished) return;
  if(e.key.length!==1) return;
  e.preventDefault();

  const chars=document.querySelectorAll(".char");
  const expected=levels[levelIndex][charIndex];

  if(e.key===expected){
    chars[charIndex].classList.add("correct");
    correct++; score+=5;
  }else{
    chars[charIndex].classList.add("wrong");
    wrong++; score-=2;
  }

  chars[charIndex].classList.remove("active");
  charIndex++;

  if(chars[charIndex]){
    chars[charIndex].classList.add("active");
  }else{
    finish();
  }

  correctEl.textContent=correct;
  wrongEl.textContent=wrong;
  scoreEl.textContent=score;
});

function finish(){
  finished=true;
  stopTimer();
  game.style.display="none";
  result.style.display="flex";

  if(score<20) rankEl.textContent="🚶 เดิน";
  else if(score<50) rankEl.textContent="🚴 ปั่นจักรยาน";
  else if(score<80) rankEl.textContent="🚗 ขี่รถ";
  else if(score<120) rankEl.textContent="✈️ เครื่องบิน";
  else rankEl.textContent="🚀 จรวด";
}

function nextLevel(){
  levelIndex=Math.min(levelIndex+1,levels.length-1);
  levelEl.textContent=levelIndex+1;
  input.value="";
  result.style.display="none";
  game.style.display="flex";
  loadCode();
}

function goBack(){
  if(levelIndex===0) return;
  levelIndex--;
  levelEl.textContent=levelIndex+1;
  input.value="";
  loadCode();
}
</script>

</body>
</html>
